# Redragon M721-Pro "Lonewolf2" — Holtek 04d9:fc5c
#
# Register layout taken from the vendor application's decompiled writers
# (docs/redragon-gaming-mouse-re.md §5, docs/hardware-checkpoint.md) and checked
# against the attached mouse. Frame rules the firmware depends on:
#
#   * every read/write sits between `F5 00` (open) and `F5 01` (close);
#   * after writes the vendor sends refresh frames `{02 F1 02 <flag>}` with the
#     flags 04 01 02 08 10 (`commands.commit_frames`, one word per frame);
#   * the active profile is register 0x2C, not part of the DPI page.
#
# It stays `verified = false` until buttons and macros are confirmed on the
# device, so the application keeps asking for the extra risk confirmation.
schema = 1
id = "holtek-04d9-fc5c"
model = "Redragon M721-Pro Lonewolf2"
provenance = "capture"
verified = false
notes = """
Vendor collection is 0xFFA0 and the feature-report table is ID 2 = 16 B,
3 = 64 B, 4 = 256 B, 5 = 1024 B, 6 = 2048 B.

LED record per profile at 0x449 + 8*p (7 bytes): R, G, B, mode, speed, mode2,
brightness. The vendor's effect list is a (mode, mode2) pair; the labels below
follow the order of the vendor UI and still need an eyes-on check for the less
common effects. Effect speed is stored inverted (vendor writes 9 - level) and
is 0 for effects without a speed.

DPI stage record at page + 2 + 6*s (5 bytes): enabled, code, high flag, 0, 0.
The code table was generated from the vendor executable. The active stage is
one byte at the start of each profile page.

Polling codes are the interval in ms: 1 = 1000 Hz, 2 = 500 Hz, 4 = 250 Hz,
8 = 125 Hz.

Button keymaps and macros are not declared yet (macro records at
0x478 + 200*slot and the keymap at 0x82 + 4*slot per profile still need
decoding); no global device settings (angle snap, lift-off, scroll,
acceleration, double-click) are declared.
"""

[collections]
# Read from the device: the vendor collection is 0xFFA0, not the 0xFF00
# the Windows-app analysis assumed (newer Holtek firmware generation).
usage_page = 0xffa0
usage = 0x01

# Feature-report table read from the device's report descriptor:
# ID 2 = 16 B (register frames), ID 3 = 64 B (block frames),
# ID 4 = 256 B (macro records; payload capacity 248).
# The descriptor also declares 1024 B / 2048 B reports as IDs 5 and 6.
[[frames]]
id = 2
len = 16

[[frames]]
id = 3
len = 64

[[frames]]
id = 4
len = 256

[profiles]
count = 5
active_window = "active_profile"

[commands]
begin = 0xf5
write = 0xf3
read = 0xf2
commit = 0xf1
commit_report = 2
# Vendor apply sequence: {02 F1 02 02} then {02 F1 02 08}.
# Vendor refresh sequence after an apply: {02 F1 02 <flag>} for 04 01 02 08 10.
commit_frames = [0x0204, 0x0201, 0x0202, 0x0208, 0x0210]
# Profile switch: write 0x2C = profile, then the full refresh sequence. Flag 01
# alone updated the register but left the LED on the old profile (checked on the
# device), so the whole sequence is sent.
activate_addr = 0x002c
activate_len = 2
activate_frames = [0x0204, 0x0201, 0x0202, 0x0208, 0x0210]

# --- read windows -----------------------------------------------------------

# Index of the profile the mouse is using.
[windows.active_profile]
report = 2
addr = 0x002c
len = 2
count = 1
per_profile = false

# Profile pages are not a uniform stride apart: the vendor capture and a live
# read agree on 0x42, 0x102, 0x1B2, 0x262, 0x312.
[windows.profile_page]
report = 3
count = 5
len = 32
addrs = [0x0042, 0x0102, 0x01b2, 0x0262, 0x0312]

[windows.led]
report = 2
addr = 0x0449
len = 7
stride = 8
count = 5

[windows.polling_lo]
report = 2
addr = 0x0032
len = 5
stride = 2
count = 3

[windows.polling_hi]
report = 2
addr = 0x0038
len = 3
stride = 2
profile_base = 3
count = 2

# --- DPI --------------------------------------------------------------------

[dpi]
window = "profile_page"
active_window_offset = 0
stage_window_offset = 2
stage_count = 5
# The vendor sends DPI writes as 16-byte frames; the register space is shared.
write_report = 2
stage_stride = 6
stage_len = 5
active_len = 1
per_axis = false

# --- polling rate -----------------------------------------------------------

[polling]
write_addrs = [0x0032, 0x0034, 0x0036, 0x0038, 0x003a]
write_len = 1

[[polling.sources]]
window = "polling_lo"
offset = 0

[[polling.sources]]
window = "polling_hi"
offset = 0

# The code is the polling interval in milliseconds.
[[polling.codes]]
hz = 125
code = 0x08

[[polling.codes]]
hz = 250
code = 0x04

[[polling.codes]]
hz = 500
code = 0x02

[[polling.codes]]
hz = 1000
code = 0x01

# --- lighting ---------------------------------------------------------------

[lighting]
window = "led"
write_addrs = [0x0449, 0x0451, 0x0459, 0x0461, 0x0469]
color_offset = 0
mode_offset = 3
mode2_offset = 5
speed_offset = 4
brightness_offset = 6
brightness_levels = 4
# The register holds 0..8 and a larger value is slower (vendor: 9 - level).
speed_levels = 9
speed_inverted = true

# Effect codes are (mode << 8) | mode2 from the vendor's LED writer.
[[lighting.modes]]
id = "breathing"
label = "Breathing"
code = 0x0104
uses_color = true
uses_speed = true

[[lighting.modes]]
id = "rainbow"
label = "Rainbow"
code = 0x0108
uses_speed = true

[[lighting.modes]]
id = "steady"
label = "Full lighted"
code = 0x0102
uses_color = true

[[lighting.modes]]
id = "wave"
label = "Wave"
code = 0x0200
uses_speed = true

[[lighting.modes]]
id = "trace"
label = "Go without trace"
code = 0x0600
uses_color = true
uses_speed = true

[[lighting.modes]]
id = "reactive"
label = "Reactive"
code = 0x0700
uses_color = true
uses_speed = true

[[lighting.modes]]
id = "flash"
label = "Flash"
code = 0x0110
uses_color = true
uses_speed = true

[[lighting.modes]]
id = "off"
label = "Off"
code = 0x0000

# --- buttons ----------------------------------------------------------------

# --- macros -----------------------------------------------------------------

# Not declared: the record encoding at 0x478 + 200*slot is still a guess, and a
# wrong write would corrupt the stored macros. Reads of that area return zeros.

